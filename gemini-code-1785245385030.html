<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px;
        }

        /* หน้าแรก: ปุ่มกดเปิด */
        #start-screen {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 1.5s infinite;
            margin-bottom: 15px;
        }

        .open-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: transform 0.2s;
        }

        .open-btn:hover {
            transform: scale(1.05);
        }

        /* หน้าสอง: การ์ดอวยพร */
        #card-screen {
            display: none;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            animation: fadeIn 1s ease-in-out;
        }

        .photo-frame {
            width: 100%;
            height: 280px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p.message {
            color: #57606f;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* เอฟเฟกต์หัวใจปลิว */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff4757;
            animation: floatUp 4s linear infinite;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- หน้าแรกก่อนเปิด -->
        <div id="start-screen">
            <div class="gift-box" onclick="openCard()">🎁</div>
            <h2 style="color: #2f3542; margin-bottom: 15px;">มีของขวัญส่งมาถึงคุณ!</h2>
            <button class="open-btn" onclick="openCard()">กดเปิดตรงนี้เลย ❤️</button>
        </div>

        <!-- หน้าเนื้อหาการ์ดอวยพร -->
        <div id="card-screen">
            <div class="photo-frame">
                <!-- ดึงไฟล์ image.png ที่อัปโหลดใน GitHub มาแสดง -->
                <img src="image.png" alt="Our Memory">
            </div>
            <h1>Happy Birthday นะคะคนดี 🎂</h1>
            <p class="message">
                สุขสันต์วันเกิดนะแฟน มีความสุขมากๆ ในทุกๆ วัน
                ขอบคุณที่เข้ามาเป็นรอยยิ้มและความสุขให้กันเสมอ
                ขอให้ปีนี้เป็นปีที่ดี สมหวังในทุกเรื่องที่ตั้งใจ
                รักและจะอยู่เคียงข้างแบบนี้ไปนานๆ เลยนะ ❤️
            </p>
        </div>
    </div>

    <script>
        function openCard() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('card-screen').style.display = 'block';
            createHearts();
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }
    </script>
</body>
</html>
